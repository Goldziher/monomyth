<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="monomyth">
<title>monomyth</title>
<defs>
  <radialGradient id="glowGold" gradientUnits="userSpaceOnUse" cx="600" cy="300" r="620" gradientTransform="translate(600 300) scale(1 0.6) translate(-600 -300)">
    <stop offset="0%" stop-color="#e0b25e" stop-opacity="0.18"/><stop offset="70%" stop-color="#e0b25e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="600" cy="315" r="760" gradientTransform="translate(600 315) scale(1 0.66) translate(-600 -315)">
    <stop offset="54%" stop-color="#0b0f1c" stop-opacity="0"/><stop offset="100%" stop-color="#0b0f1c" stop-opacity="0.7"/>
  </radialGradient>
</defs>
<rect width="1200" height="630" fill="#141a2e"/>
<rect width="1200" height="630" fill="url(#glowGold)"/>
<rect width="1200" height="630" fill="url(#vignette)"/>

<!-- mark, centred above the wordmark -->
<g transform="translate(537.5 185) scale(2.6)">
  <rect width="48" height="48" rx="11" fill="#1b2340"/>
  <polyline points="24,24 28,24 28,20 20,20 20,28 32,28 32,16 16,16 16,32 36,32 36,12 12,12 12,36 36,36"
            fill="none" stroke="#e0b25e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="2.2" fill="#f4ead6"/>
</g>

<!-- wordmark tspans MUST stay adjacent -->
<text x="600" y="445" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif" font-size="104" font-weight="600" letter-spacing="-2"><tspan fill="#f4ead6">mono</tspan><tspan fill="#e0b25e">myth</tspan></text>
</svg>
