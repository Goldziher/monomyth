[package]
name = "monomyth-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[features]
acquire = ["dep:regex", "dep:reqwest", "dep:sha2", "dep:time", "dep:tokio"]

[dependencies]
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, default-features = false, features = ["rustls", "gzip", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true, optional = true, features = ["formatting", "macros", "parsing"] }
tokio = { workspace = true, optional = true, features = ["time", "fs"] }
xberg = { workspace = true }
xberg-rag = { workspace = true, features = ["vector-store", "sqlite", "pipeline", "pipeline-embeddings"] }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
