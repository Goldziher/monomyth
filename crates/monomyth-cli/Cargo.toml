clap = { workspace = true }
dotenvy = { workspace = true }
monomyth-contracts = { workspace = true }
monomyth-core = { workspace = true }
monomyth-eval = { workspace = true }
monomyth-extract = { workspace = true }
monomyth-gen = { workspace = true }
monomyth-knowledge = { workspace = true, features = ["acquire"] }
monomyth-llm = { workspace = true }
monomyth-synthesis = { workspace = true }
monomyth-text = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
monomyth-frameworks = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
