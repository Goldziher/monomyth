[package]
name = "monomyth-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "monomyth"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
