[package]
name = "monomyth-eval"
description = "Deterministic, LLM-free benchmark-scoring harness for the contract's classification/distribution claims."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[features]
# The prose-level embedding-cosine axis (SemanticReport / EvalReport). Off by
# default so the crate's default surface stays the pure, deterministic scoring
# core; it adds no dependency — the scorer takes embedding vectors directly.
semantic = []

[dependencies]
monomyth-core = { workspace = true }
monomyth-frameworks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
monomyth-knowledge = { workspace = true }
slotmap = { workspace = true }

[lints]
workspace = true
