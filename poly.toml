# poly (polylint) config for monomyth — Rust workspace, corpus tooling, and docs.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    ".polylint/**",
    "dist/**",
    "node_modules/**",
    "target/**",
    "vendor/**",
    # Generated corpus outputs + cached raw downloads — data, not source. See corpus/README.md.
    "artifacts/**",
    "corpus/raw/**",
    # Generated by ai-rulez (`ai-rulez generate`); regenerate, never hand-edit or reformat.
    ".ai-rulez/.generated-manifest.json",
]

[lint.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[fmt.markdown.rumdl]
disable = ["MD013", "MD024", "MD033", "MD036", "MD041"]

[lint.typos]
# `ser` is the conventional serde Serializer binding; `certifi` is the Python TLS-cert package.
extend_words = { ser = "ser", certifi = "certifi" }
extend_exclude = ["artifacts/**", "corpus/raw/**"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
polylint = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "dist/**",
    "node_modules/**",
    "target/**",
    "vendor/**",
    "artifacts/**",
    "corpus/raw/**",
] }
polyfmt = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "dist/**",
    "node_modules/**",
    "target/**",
    "vendor/**",
    "artifacts/**",
    "corpus/raw/**",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
    "**/*.lock",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "dist/**",
    "node_modules/**",
    "target/**",
    "vendor/**",
    "artifacts/**",
    "corpus/raw/**",
] }
cargo = true

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true
