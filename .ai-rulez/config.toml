version = "5.0"
name = "monomyth"
description = "Adventure generation engine — text-based adventures and dynamically-generated pixel-art games, grounded in comparative mythology. Rust workspace + xberg RAG."
gitignore = true

presets = ["claude", "codex", "opencode"]

builtins = ["rust", "documentation", "default-commands"]

[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "pnpm"
args = ["dlx", "ai-rulez@latest", "mcp"]

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
text = """
AI-RULEZ :: GENERATED FILE — DO NOT EDIT
Source: .ai-rulez/config.toml and .ai-rulez/
Regenerate: pnpm dlx ai-rulez@5.0.1 generate
Use MCP server: pnpm dlx ai-rulez@5.0.1 mcp
"""
hashes = "full"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
