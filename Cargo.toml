# xberg / xberg-rag / liter-llm are declared at their crates.io versions in the crates that use them
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
monomyth-contracts = { path = "crates/monomyth-contracts" }
monomyth-core = { path = "crates/monomyth-core" }
monomyth-eval = { path = "crates/monomyth-eval" }
monomyth-extract = { path = "crates/monomyth-extract" }
monomyth-frameworks = { path = "crates/monomyth-frameworks" }
monomyth-gen = { path = "crates/monomyth-gen" }
monomyth-knowledge = { path = "crates/monomyth-knowledge" }
monomyth-llm = { path = "crates/monomyth-llm" }
monomyth-text = { path = "crates/monomyth-text" }
rand = "0.9.2"
rand_chacha = "0.9.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
slotmap = { version = "1.0.7", features = ["serde"] }
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
xberg = "1.0.0-rc.14"
xberg-rag = "1.0.0-rc.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }

[patch.crates-io]
xberg = { path = "../xberg-io/xberg/crates/xberg" }
xberg-rag = { path = "../xberg-io/xberg/crates/xberg-rag" }
liter-llm = { path = "../xberg-io/liter-llm/crates/liter-llm" }
