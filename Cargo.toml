# monomyth — virtual workspace. All crates live under `crates/`.
# xberg / xberg-rag / liter-llm are declared at their crates.io versions in the crates that use them
# and redirected to the local checkouts via [patch.crates-io] for co-development; drop the patch to
# build from crates.io.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]

# Dependencies are kept alphabetical (cargo-sort). Internal crates are the `monomyth-*` path
# entries; the rest are shared third-party pinned to the versions used by the xberg-io workspace.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
monomyth-core = { path = "crates/monomyth-core" }
monomyth-frameworks = { path = "crates/monomyth-frameworks" }
monomyth-gen = { path = "crates/monomyth-gen" }
monomyth-knowledge = { path = "crates/monomyth-knowledge" }
monomyth-llm = { path = "crates/monomyth-llm" }
monomyth-text = { path = "crates/monomyth-text" }
rand = "0.9.2"
rand_chacha = "0.9.0"
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slotmap = { version = "1.0.7", features = ["serde"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# xberg-io stack — declared at their crates.io versions and redirected to the local checkouts via
# [patch.crates-io] below for co-development. Drop the patch to build from crates.io.
xberg = "1.0.0-rc.14"
xberg-rag = "1.0.0-rc.14"

# Lints are defined once here and inherited by every crate via `[lints] workspace = true`.
# Priorities: group lints use priority -1 so individual overrides (priority 0/1) win.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Deliberate domain convention: the taxonomy enums pair with a `*Info` record
# (`MonomythStage` / `MonomythStageInfo`), so the repeated stem is intentional.
module_name_repetitions = { level = "allow", priority = 1 }

# Local co-development redirect for the xberg-io stack. `liter-llm` enters the graph transitively via
# `xberg`'s `structured` feature. Remove this block to build against the published crates.io versions.
[patch.crates-io]
xberg = { path = "../xberg-io/xberg/crates/xberg" }
xberg-rag = { path = "../xberg-io/xberg/crates/xberg-rag" }
liter-llm = { path = "../xberg-io/liter-llm/crates/liter-llm" }
