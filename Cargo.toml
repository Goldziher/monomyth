# xberg is consumed as a published crate from crates.io. The RAG base layer
# (formerly the standalone xberg-rag crate) now lives in-tree as
# monomyth-knowledge's `rag` submodule; there is no xberg-rag dependency.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
monomyth-compose = { path = "crates/monomyth-compose" }
monomyth-config = { path = "crates/monomyth-config" }
monomyth-contracts = { path = "crates/monomyth-contracts" }
monomyth-core = { path = "crates/monomyth-core" }
monomyth-eval = { path = "crates/monomyth-eval" }
monomyth-extract = { path = "crates/monomyth-extract" }
monomyth-frameworks = { path = "crates/monomyth-frameworks" }
monomyth-gen = { path = "crates/monomyth-gen" }
monomyth-knowledge = { path = "crates/monomyth-knowledge" }
monomyth-llm = { path = "crates/monomyth-llm" }
monomyth-synthesis = { path = "crates/monomyth-synthesis" }
monomyth-text = { path = "crates/monomyth-text" }
opendal = { version = "0.57.0", default-features = false, features = ["services-fs"] }
rand = "0.10.2"
rand_chacha = "0.10.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slotmap = { version = "1.1.1", features = ["serde"] }
sqlite-vec = "0.1"
tempfile = "3"
thiserror = "2.0.19"
time = "0.3.54"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xberg = "1.0.0-rc.30"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
