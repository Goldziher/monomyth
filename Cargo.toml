# xberg / xberg-rag are consumed from the local xberg-io checkout via path dependencies.
# liter-llm (xberg's transitive dep) is pinned to the matching local checkout via the patch below.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
monomyth-config = { path = "crates/monomyth-config" }
monomyth-contracts = { path = "crates/monomyth-contracts" }
monomyth-core = { path = "crates/monomyth-core" }
monomyth-eval = { path = "crates/monomyth-eval" }
monomyth-extract = { path = "crates/monomyth-extract" }
monomyth-frameworks = { path = "crates/monomyth-frameworks" }
monomyth-gen = { path = "crates/monomyth-gen" }
monomyth-knowledge = { path = "crates/monomyth-knowledge" }
monomyth-llm = { path = "crates/monomyth-llm" }
monomyth-synthesis = { path = "crates/monomyth-synthesis" }
monomyth-text = { path = "crates/monomyth-text" }
opendal = { version = "0.58.0", default-features = false, features = ["services-fs"] }
rand = "0.10.2"
rand_chacha = "0.10.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
slotmap = { version = "1.1.1", features = ["serde"] }
tempfile = "3"
thiserror = "2.0.18"
time = "0.3.53"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xberg = { path = "../xberg-io/xberg/crates/xberg" }
xberg-rag = { path = "../xberg-io/xberg/crates/xberg-rag" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }

[patch.crates-io]
liter-llm = { path = "../xberg-io/liter-llm/crates/liter-llm" }
