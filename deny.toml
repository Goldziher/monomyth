# monomyth is a proprietary, unpublished workspace crate, so its own license check is skipped;
# third-party dependencies must carry one of the permissive licenses allowed below.

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2025-0119"]
