# cargo-deny config (run via the poly cargo-deny hook).
# monomyth is a proprietary, unpublished workspace crate, so its own license check is skipped;
# third-party dependencies must carry one of the permissive licenses allowed below.

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Permissive Unicode data license on the older unicode-* crates in the xberg text stack.
    "Unicode-DFS-2016",
    # Community Data License Agreement (permissive) on the tokenizers/hf-hub ML deps
    # pulled in by xberg-rag's local ONNX embeddings — permissive, commercial-safe.
    "CDLA-Permissive-2.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) transitive crates from the xberg/ML stack that we cannot
# fix downstream. Both are feature-complete, widely-used macro/format helpers. Revisit when
# xberg drops them; any NEW advisory still fails the build.
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained (proc-macro helper, via xberg)
    "RUSTSEC-2025-0119", # number_prefix — unmaintained (via hf-hub progress bars)
]
